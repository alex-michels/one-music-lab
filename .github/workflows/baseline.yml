name: Baseline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Tests, types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Unit tests and roadmap integrity
        run: npm test
      - name: Reproduce notation glyphs from pinned Verovio
        run: npm run glyphs:check
      - name: Browser, audio and accessibility tests (Chromium, Firefox, WebKit)
        run: npm run test:browser
      - name: Coverage over all authored code (no threshold gate yet)
        run: |
          mkdir -p outputs
          npm run test:coverage 2>&1 | tee outputs/coverage-report.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Rendered site identity from the built Worker
        env:
          OML_TEST_BASE_URL: http://127.0.0.1:8787
        run: |
          npm start -- --ip 127.0.0.1 --port 8787 > outputs/site-server.txt 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null --max-time 2 "$OML_TEST_BASE_URL/"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat outputs/site-server.txt
            exit 1
          fi
          npm run test:site
      - name: Build portable static staging artifact (no deployment)
        run: |
          npm run build:static
          npm run test:static
          # The three language roots are documents in their own right, not
          # variants of index.html: en/ru/de each carry their own lang, their
          # own description and their own canonical. Packing the list without
          # them would ship an English-only site under the name "portable".
          # Add a line here when LANGUAGES grows.
          tar -czf outputs/one-music-lab-static.tgz -C dist/client index.html index.rsc 404.html favicon.svg _next en.html en.rsc ru.html ru.rsc de.html de.rsc -C ../.. LICENSE NOTICE CONTENT-LICENSE.md THIRD-PARTY-NOTICES.md LICENSES
          cd outputs
          sha256sum one-music-lab-static.tgz > one-music-lab-static.tgz.sha256
      - name: Attach portable artifact for private staging review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-staging
          path: |
            outputs/one-music-lab-static.tgz
            outputs/one-music-lab-static.tgz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Explain validation limits
        if: always()
        run: |
          printf '%s\n' '## Baseline only — not publication readiness' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Coverage now measures every authored file, but the numbers are low and no threshold is enforced yet; browser and audio paths are not covered. ROADMAP P00 and gate G remain open.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Lint is a required step; the run fails on any lint error.' >> "$GITHUB_STEP_SUMMARY"
      - name: Attach audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-audit-reports
          path: |
            outputs/coverage-report.txt
            outputs/coverage/coverage-summary.json
            outputs/coverage/lcov.info
            outputs/site-server.txt
            outputs/notation-553/
          if-no-files-found: warn
          retention-days: 14
